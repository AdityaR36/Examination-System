<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examiner Sign In | ExamPro</title><script>(function(){var p=location.pathname,marks=['/admin','/student','/examiner'];var base='/';for(var i=0;i<marks.length;i++){var n=p.indexOf(marks[i]);if(n>=0){base=p.slice(0,n+1);break;}}if(base==='/'&&p!=='/'&&!p.startsWith('/admin')&&!p.startsWith('/student')&&!p.startsWith('/examiner'))base=p.endsWith('/')?p:p.slice(0,p.lastIndexOf('/')+1);window.examproBase=base;var b=document.createElement('base');b.href=base;document.head.appendChild(b);})();</script><link rel="stylesheet" href="styles.css"></head><body class="portal-login"><a class="back-home" href="./">← Back to home</a><main class="login-card"><a class="home-brand" href="./"><span class="brand-icon">E</span> ExamPro</a><div class="login-icon">▤</div><div class="portal-label">EXAMINER PORTAL</div><h1>Sign in to your account</h1><p class="muted">Examiner accounts are created by the administrator. Sign in to manage assessments and students.</p><div id="message"></div><form id="loginForm"><div class="field"><label>Email address</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="button primary login-submit">Sign in →</button></form><div class="login-note">Don't have an account? Contact your administrator.</div></main><link rel="stylesheet" href="theme.css"><script src="auth-client.js"></script><script>const form=document.querySelector('#loginForm');form.addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(form));const box=document.querySelector('#message');try{const r=await fetch('/api/examiner/signin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Sign in failed');sessionStorage.setItem('examproToken',d.token);localStorage.setItem('examproExaminer',JSON.stringify(d.examiner));location.href='/examiner/workspace';}catch(err){box.innerHTML='<div class="notice error">'+String(err.message).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</div>';}});</script></body></html>
