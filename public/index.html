<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExamPro — Online Examination System</title>
  <script>(function(){var p=location.pathname,marks=['/admin','/student','/examiner'];var base='/';for(var i=0;i<marks.length;i++){var n=p.indexOf(marks[i]);if(n>=0){base=p.slice(0,n+1);break;}}if(base==='/'&&p!=='/'&&!p.startsWith('/admin')&&!p.startsWith('/student')&&!p.startsWith('/examiner'))base=p.endsWith('/')?p:p.slice(0,p.lastIndexOf('/')+1);window.examproBase=base;var b=document.createElement('base');b.href=base;document.head.appendChild(b);})();</script><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon">E</span><span>ExamPro</span></div>
    <div class="role-switch"><span class="role-dot"></span><span id="roleLabel">Examiner workspace</span></div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard">▦ <span>Dashboard</span></button>
      <button class="nav-item" data-page="create">＋ <span>Create test</span></button>
      <button class="nav-item" data-page="tests">▤ <span>Test library</span></button>
      <button class="nav-item" data-page="students">♙ <span>Student verification</span></button>
      <button class="nav-item" data-page="student">▷ <span>Student portal</span></button>
      <button class="nav-item" data-page="results">▥ <span>Results</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="avatar">ER</div><div><b>Examiner</b><small>Demo workspace</small></div><span class="dots">•••</span></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><span class="eyebrow">EXAM MANAGEMENT</span><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><span class="secure">● Prototype mode</span><a class="button" id="studentPortalLink" href="student">↗ Student portal</a><button class="button primary" id="quickCreate">＋ Create new test</button></div></header>
    <div id="content" class="content"></div>
    <footer>ExamPro prototype <span>•</span> Excel-powered assessments <span>•</span> Local demo data</footer>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="auth-client.js"></script><script src="app.js"></script>
</body></html>
